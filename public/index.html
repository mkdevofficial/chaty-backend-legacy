<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-accent="teal" data-wallpaper="default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Chaty — a fast, private, mobile-first messaging app.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chaty">
  <title>Chaty</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('chaty_prefs') || '{}');
        var theme = p.theme === 'light' ? 'light' : 'dark';
        var accent = ['teal','violet','rose','amber'].indexOf(p.accent) >= 0 ? p.accent : 'teal';
        var wallpaper = ['default','dots','waves','paper'].indexOf(p.wallpaper) >= 0 ? p.wallpaper : 'default';
        var lang = p.lang === 'en' ? 'en' : 'ar';
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.accent = accent;
        root.dataset.wallpaper = wallpaper;
        root.lang = lang;
        root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#eef2f9' : '#08111f');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="app-shell">
      <div class="view-root" style="display:grid;place-items:center">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
          <div class="auth-logo" style="margin:0">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </div>
          <div class="loader" aria-label="Loading"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="modal-root"></div>
  <noscript>Chaty requires JavaScript. / يحتاج Chaty إلى تفعيل JavaScript.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
